name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (sin red)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias (requirements.txt con pinning)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pip-audit

      - name: Compilar todos los módulos
        run: python -m compileall api tests

      - name: Escaneo de vulnerabilidades de dependencias
        run: pip-audit -r requirements.txt

      - name: Correr suite (excluye tests marcados network)
        run: pytest -v -m "not network" tests/
